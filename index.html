<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeSync</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.png" />
    <meta name="description" content="Codeforces companion app featuring Expeditions, Solved Library, and AI-powered Greedy's Ground mentor and examiner." />
    <meta property="og:title" content="CodeSync" />
    <meta property="og:description" content="Codeforces companion app featuring Expeditions, Solved Library, and AI-powered Greedy's Ground mentor and examiner." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- MathJax 3 for rendering formulas in chat ($...$ and $$...$$) -->
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [['$', '$'], ['\\(', '\\)']],
          displayMath: [['$$', '$$'], ['\\[', '\\]']],
          processEscapes: true,
          processEnvironments: true
        },
        options: {
          skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
        },
        chtml: {
          scale: 1.05
        },
        startup: {
          typeset: false
        }
      };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
